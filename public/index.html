<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agro-OPS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍉</text></svg>">
<script>
  // Apply stored theme before first paint. Missing value is Canopy. "auto" follows the system.
  const t = localStorage.getItem('baazaru-theme');
  const themes = ['light', 'dark', 'citrus', 'grove', 'canopy', 'depth'];
  if (themes.includes(t)) document.documentElement.dataset.theme = t;
  else if (t !== 'auto') document.documentElement.dataset.theme = 'canopy';
</script>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/sign.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 17c-4 0-6.5-2.6-6.5-6.5C3.5 6 6.5 3 10.5 3c3 0 5.5 1.5 6 4-1 5.5-3.5 10-6.5 10z"/>
          <path d="M4.5 15.5C7 12 10 9.5 14 8"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">agro-OPS</div>
        <div class="brand-sub">inventory and records</div>
      </div>
    </div>
    <nav class="nav" id="main-nav" aria-label="Main">
      <a class="nav-item" href="#/dashboard" data-route="dashboard" data-mobile-primary>
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.5" y="2.5" width="5.2" height="5.2" rx="1.2"/><rect x="10.3" y="2.5" width="5.2" height="5.2" rx="1.2"/><rect x="2.5" y="10.3" width="5.2" height="5.2" rx="1.2"/><rect x="10.3" y="10.3" width="5.2" height="5.2" rx="1.2"/></svg>
        Dashboard</a>
      <a class="nav-item" href="#/inventory" data-route="inventory" data-mobile-primary>
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 5.8 9 2.8l6.2 3v6.4L9 15.2l-6.2-3z"/><path d="M2.8 5.8 9 8.8l6.2-3M9 8.8v6.4"/></svg>
        Inventory</a>
      <a class="nav-item" href="#/shipments" data-route="shipments" data-mobile-primary>
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.4 11.2h13.2L14.2 13.6a1.6 1.6 0 0 1-1.4.9H5.2a1.6 1.6 0 0 1-1.4-.9z"/><path d="M4.2 11.2 5.4 6.6h7.2l1.2 4.6"/><path d="M9 6.6V3.4M9 3.8h3.4"/></svg>
        Shipments <span class="nav-count" data-count="shipments" hidden></span></a>
      <a class="nav-item" href="#/products" data-route="products">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="2.6" width="11.6" height="12.8" rx="1.6"/><path d="M6.2 6.4h5.6M6.2 9.2h5.6M6.2 12h3.4"/></svg>
        Items</a>
      <a class="nav-item" href="#/sell-first" data-route="sell-first">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6.5"/><path d="M9 5.5V9l2.6 1.6"/></svg>
        Sell first <span class="nav-count" data-count="sell-first" hidden></span></a>
      <a class="nav-item" href="#/pos" data-route="pos" data-mobile-primary>
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 6.4h9.6l-.8 7.2H5z"/><path d="M6.6 6.4V5a2.4 2.4 0 0 1 4.8 0v1.4"/></svg>
        POS</a>
      <a class="nav-item" href="#/customers" data-route="customers">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.6" cy="6.4" r="2.6"/><path d="M2.4 15c.3-2.6 2-4.3 4.2-4.3s3.9 1.7 4.2 4.3"/><circle cx="12.6" cy="7.2" r="2"/><path d="M12 10.9c1.9.1 3.3 1.5 3.6 3.6"/></svg>
        Customers</a>
      <a class="nav-item" href="#/farmers" data-route="farmers">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.4" cy="6.2" r="2.3"/><path d="M2.4 15c.3-2.5 1.8-4 4-4s3.7 1.5 4 4"/><path d="M12.2 3.6c1.4.2 2.6 1.2 2.8 2.6-1.6.4-2.8-.2-3.2-1.4"/><path d="M12.6 6.2v3.4"/></svg>
        Farmers</a>
      <a class="nav-item" href="#/history" data-route="history">
        <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9a6.5 6.5 0 1 1 1.9 4.6M2.5 13.6V9.9h3.7"/><path d="M9 6v3.2l2.3 1.4"/></svg>
        History</a>
    </nav>
    <button class="mobile-nav-toggle" id="mobile-nav-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
      <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true"><circle cx="4" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="16" cy="10" r="1.5"/></svg>
      More
    </button>
    <div class="sidebar-foot">
      <div class="quick">
        <button class="quick-btn" id="quick-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="quick-menu">
          <span class="user-dot" aria-hidden="true"></span>
          <span class="user-line" id="user-line" hidden>
            <span id="user-name"></span><span class="chip" id="user-role"></span>
          </span>
          <span id="quick-fallback">Settings</span>
          <svg class="quick-chevron" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 10l4-4 4 4"/></svg>
          <span class="mobile-settings-label" aria-hidden="true">Settings</span>
        </button>
        <div id="quick-menu" class="quick-menu" role="menu" hidden>
          <div class="quick-body">
          <div id="quick-main">
            <button class="quick-item" id="users-btn" type="button" role="menuitem" hidden>Users</button>
            <button class="quick-item" id="boats-btn" type="button" role="menuitem" hidden>Boats</button>
            <button class="quick-item" id="account-btn" type="button" role="menuitem" hidden>Account</button>
            <button class="quick-item" id="biz-btn" type="button" role="menuitem">Business details</button>
            <div class="theme-sep" role="separator"></div>
            <button class="quick-item" id="themes-btn" type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-list">
              Themes
              <span class="quick-value" data-theme-current>Canopy</span>
            </button>
          </div>
          <div id="theme-list" class="theme-list" role="group" aria-label="Theme" hidden>
            <button type="button" class="quick-item themes-back" id="themes-back" role="menuitem">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4L6 8l4 4"/></svg>
              Settings
            </button>
            <div class="quick-label">Theme · <span data-theme-current>Canopy</span></div>
            <button type="button" class="theme-opt" role="menuitemradio" data-theme-choice="auto" aria-checked="false"><span class="theme-swatch swatch-auto" aria-hidden="true"></span>Auto</button>
            <button type="button" class="theme-opt" role="menuitemradio" data-theme-choice="light" aria-checked="false"><span class="theme-swatch swatch-light" aria-hidden="true"></span>Light</button>
            <button type="button" class="theme-opt" role="menuitemradio" data-theme-choice="dark" aria-checked="false"><span class="theme-swatch swatch-dark" aria-hidden="true"></span>Dark</button>
            <div class="theme-sep" role="separator"></div>
            <button type="button" class="theme-opt" role="menuitemradio" data-theme-choice="citrus" aria-checked="false"><span class="theme-swatch swatch-citrus" aria-hidden="true"></span>Citrus</button>
            <button type="button" class="theme-opt" role="menuitemradio" data-theme-choice="grove" aria-checked="false"><span class="theme-swatch swatch-grove" aria-hidden="true"></span>Grove</button>
            <button type="button" class="theme-opt" role="menuitemradio" data-theme-choice="canopy" aria-checked="true"><span class="theme-swatch swatch-canopy" aria-hidden="true"></span>Canopy</button>
            <button type="button" class="theme-opt" role="menuitemradio" data-theme-choice="depth" aria-checked="false"><span class="theme-swatch swatch-depth" aria-hidden="true"></span>Depth</button>
          </div>
          </div>
          <div class="quick-foot">
            <div class="theme-sep" role="separator"></div>
            <button class="quick-item" id="logout-btn" type="button" role="menuitem" hidden>Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Dashboard</h1>
        <p id="page-sub" class="page-sub"></p>
      </div>
      <div id="page-actions" class="page-actions"></div>
    </header>
    <div id="view" aria-live="polite"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="assertive"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
